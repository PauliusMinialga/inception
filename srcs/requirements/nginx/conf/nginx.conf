server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name __DOMAIN_NAME__;

    # TLS Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/tls/__DOMAIN_NAME__.crt;
    ssl_certificate_key /etc/nginx/tls/__DOMAIN_NAME__.key;

    # Root directory for website files
    root /var/www/html;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Pass PHP scripts to the WordPress (PHP-FPM) container
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Deny access to .htaccess files
    location ~ /\.ht {
        deny all;
    }
} 